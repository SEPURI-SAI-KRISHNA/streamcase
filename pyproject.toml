[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streamcase"
dynamic = ["version"]
description = "Deterministic testing for Apache Spark Structured Streaming pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Sepuri Sai Krishna" },
]
keywords = [
  "apache-spark",
  "pyspark",
  "pytest",
  "structured-streaming",
  "testing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SEPURI-SAI-KRISHNA/streamcase"
Documentation = "https://github.com/SEPURI-SAI-KRISHNA/streamcase#readme"
Issues = "https://github.com/SEPURI-SAI-KRISHNA/streamcase/issues"
Repository = "https://github.com/SEPURI-SAI-KRISHNA/streamcase"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=7,<8",
]

[tool.hatch.version]
path = "src/streamcase/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamcase"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts", "src", "tests"]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "spark: integration tests that require PySpark and a compatible Java runtime",
]

[tool.coverage.run]
branch = true
source = ["streamcase"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
