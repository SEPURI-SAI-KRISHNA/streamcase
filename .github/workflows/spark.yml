name: Spark integration

on:
  pull_request:
    paths:
      - ".github/workflows/spark.yml"
      - "docs/spark-compatibility.md"
      - "pyproject.toml"
      - "src/**"
      - "scripts/smoke_installed.py"
      - "tests/spark/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spark.yml"
      - "docs/spark-compatibility.md"
      - "pyproject.toml"
      - "src/**"
      - "scripts/smoke_installed.py"
      - "tests/spark/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark:
    name: Spark 4.2 / Python 3.11 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build

      - name: Smoke-test clean wheel install (Spark)
        run: |
          artifacts=(dist/*.whl)
          test "${#artifacts[@]}" -eq 1 && test -f "${artifacts[0]}"
          python -m venv .tmp/smoke-spark-wheel
          .tmp/smoke-spark-wheel/bin/python -m pip install "${artifacts[0]}[test,spark]"
          export PYSPARK_PYTHON="$PWD/.tmp/smoke-spark-wheel/bin/python"
          .tmp/smoke-spark-wheel/bin/python -I scripts/smoke_installed.py spark

      - name: Smoke-test clean sdist install (Spark)
        run: |
          artifacts=(dist/*.tar.gz)
          test "${#artifacts[@]}" -eq 1 && test -f "${artifacts[0]}"
          python -m venv .tmp/smoke-spark-sdist
          .tmp/smoke-spark-sdist/bin/python -m pip install "${artifacts[0]}[spark]"
          export PYSPARK_PYTHON="$PWD/.tmp/smoke-spark-sdist/bin/python"
          .tmp/smoke-spark-sdist/bin/python -I scripts/smoke_installed.py spark

      - name: Report runtime versions
        run: |
          .tmp/smoke-spark-wheel/bin/python --version
          java -version
          .tmp/smoke-spark-wheel/bin/python -c "import pyspark; print(f'PySpark {pyspark.__version__}')"

      - name: Run Spark integration tests from installed wheel
        run: |
          export PYSPARK_PYTHON="$PWD/.tmp/smoke-spark-wheel/bin/python"
          .tmp/smoke-spark-wheel/bin/python -m pytest -m spark -v
