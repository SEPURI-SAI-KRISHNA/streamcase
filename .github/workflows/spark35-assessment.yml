name: Spark 3.5 assessment

on:
  pull_request:
    paths:
      - ".github/workflows/spark35-assessment.yml"

permissions:
  contents: read

concurrency:
  group: spark35-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: Spark 3.5.9 / Python 3.11 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build and install assessment environment
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel
          artifacts=(dist/*.whl)
          test "${#artifacts[@]}" -eq 1 && test -f "${artifacts[0]}"
          python -m venv .tmp/spark35-assessment
          .tmp/spark35-assessment/bin/python -m pip install "${artifacts[0]}[test]" "pyspark==3.5.9"
          .tmp/spark35-assessment/bin/python -m pip check

      - name: Report and verify runtime versions
        run: |
          .tmp/spark35-assessment/bin/python --version
          java -version
          .tmp/spark35-assessment/bin/python -c "import pyspark; assert pyspark.__version__ == '3.5.9', pyspark.__version__; print(f'PySpark {pyspark.__version__}')"

      - name: Assess public Spark behavior from installed wheel
        run: |
          export PYSPARK_PYTHON="$PWD/.tmp/spark35-assessment/bin/python"
          .tmp/spark35-assessment/bin/python -m pytest -m spark -v \
            --ignore=tests/spark/test_environment.py
