name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # A release event identifies the tagged commit. Build that immutable SHA,
          # then verify the tag still resolves to it and it belongs to main.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Release ref does not match the release tag"
            exit 1
          fi
          tagged_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          checked_out_commit=$(git rev-parse --verify HEAD)
          main_commit=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          if [[ "$tagged_commit" != "$RELEASE_SHA" || "$checked_out_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag, event SHA, and checked-out commit differ"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged_commit" "$main_commit"; then
            echo "::error::Release tag does not point to a commit on main"
            exit 1
          fi
          echo "Verified release source: $RELEASE_TAG -> $tagged_commit (on main)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"

      - name: Install build tools
        run: python -m pip install "build>=1.2,<2" "twine>=7,<8"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Record distribution hashes
        run: python scripts/check_distribution_hashes.py record dist

      - name: Upload temporary Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/streamcase/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Verify downloaded distribution hashes
        run: |
          python scripts/check_distribution_hashes.py verify dist
          mv dist/SHA256SUMS SHA256SUMS

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
